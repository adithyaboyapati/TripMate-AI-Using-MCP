<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to TripMate AI — Your AI-powered travel planner">
    <title>Login — TripMate AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">

    <style>
        /* Login page — shares the aurora background from style.css */

        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: rgba(10, 16, 32, 0.88);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 28px;
            padding: 3rem 2.5rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(59, 130, 246, 0.08);
            animation: fadeUp 0.6s both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-brand {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin: 0 auto 1rem;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.45);
        }

        .login-title {
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: #f0f4ff;
            letter-spacing: -0.03em;
            margin: 0 0 6px;
        }

        .login-title em {
            font-style: normal;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-subtitle {
            font-size: 0.875rem;
            color: #4b5a72;
            margin: 0;
        }

        /* Error box */
        .login-error {
            display: none;
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #fca5a5;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            animation: fadeUp 0.3s both;
        }
        .login-error.show { display: block; }

        /* Form */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #4b5a72;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            color: #f0f4ff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            box-sizing: border-box;
        }

        .form-input::placeholder { color: #2d3a52; }

        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.06);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
        }

        /* Login button */
        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
            letter-spacing: 0.01em;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(59, 130, 246, 0.5);
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .login-hint {
            text-align: center;
            margin-top: 1.75rem;
            font-size: 0.78rem;
            color: #2d3a52;
            line-height: 1.5;
        }

        .login-hint code {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 6px;
            padding: 2px 7px;
            color: #4b5a72;
            font-size: 0.76rem;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 1.5rem 0 1.25rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.07);
        }

        .divider-text {
            font-size: 0.75rem;
            color: #2d3a52;
            white-space: nowrap;
        }

        /* Feature badges */
        .feature-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 1.2rem;
        }

        .fchip {
            font-size: 0.72rem;
            color: #4b5a72;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 100px;
            padding: 3px 10px;
        }

        /* Spinner */
        .btn-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <!-- Aurora Background (reused from style.css) -->
    <div class="page-bg" aria-hidden="true">
        <div class="aurora a1"></div>
        <div class="aurora a2"></div>
        <div class="aurora a3"></div>
    </div>

    <div class="login-wrap">
        <div class="login-card">

            <!-- Brand -->
            <div class="login-brand">
                <div class="login-icon">✈️</div>
                <h1 class="login-title">TripMate<em>AI</em></h1>
                <p class="login-subtitle">Sign in to access your AI travel planner</p>
            </div>

            <!-- Error message -->
            <div id="loginError" class="login-error" role="alert">
                ⚠️ <span id="loginErrorMsg">Invalid credentials</span>
            </div>

            <!-- Login form -->
            <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
                <div class="form-group">
                    <label class="form-label" for="loginUsername">Username</label>
                    <input
                        type="text"
                        id="loginUsername"
                        class="form-input"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        class="form-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" id="loginBtn" class="login-btn">
                    <span id="loginBtnContent">Sign In →</span>
                </button>
            </form>

            <div class="divider">
                <span class="divider-text">Powered by 8 AI Agents</span>
            </div>

            <div class="feature-chips">
                <span class="fchip">✈️ Live Flights</span>
                <span class="fchip">🏨 Real Hotels</span>
                <span class="fchip">🌤️ Weather</span>
                <span class="fchip">🍽️ Restaurants</span>
                <span class="fchip">💱 Currency</span>
                <span class="fchip">📅 Itinerary</span>
            </div>

            <p class="login-hint">
                Default credentials: <code>admin</code> / <code>tripmate123</code><br>
                Change via <code>TRIPMATE_USER</code> / <code>TRIPMATE_PASSWORD</code> in .env
            </p>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();

            const username   = document.getElementById("loginUsername").value.trim();
            const password   = document.getElementById("loginPassword").value;
            const btn        = document.getElementById("loginBtn");
            const btnContent = document.getElementById("loginBtnContent");
            const errorDiv   = document.getElementById("loginError");
            const errorMsg   = document.getElementById("loginErrorMsg");

            if (!username || !password) {
                errorMsg.textContent = "Please enter both username and password.";
                errorDiv.classList.add("show");
                return;
            }

            // Reset error
            errorDiv.classList.remove("show");

            // Loading state
            btn.disabled     = true;
            btnContent.innerHTML = '<span class="btn-spinner"></span>Signing in...';

            try {
                const res = await fetch("/api/login", {
                    method:  "POST",
                    headers: { "Content-Type": "application/json" },
                    body:    JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success) {
                    // Redirect to main app
                    window.location.href = "/";
                } else {
                    errorMsg.textContent = data.error || "Invalid credentials.";
                    errorDiv.classList.add("show");
                    btn.disabled         = false;
                    btnContent.innerHTML = "Sign In →";
                }

            } catch (err) {
                errorMsg.textContent = "Connection error. Please try again.";
                errorDiv.classList.add("show");
                btn.disabled         = false;
                btnContent.innerHTML = "Sign In →";
            }
        }

        // Allow Enter key on any field
        document.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                const form = document.getElementById("loginForm");
                if (form) form.requestSubmit();
            }
        });
    </script>
</body>
</html>
